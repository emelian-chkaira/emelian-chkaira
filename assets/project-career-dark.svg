<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="218" viewBox="0 0 1000 218" role="img" aria-label="AI Career Tracker: I built this for my own job hunt. It collects jobs from career pages, ranks them against my CV, tailors the CV for each one and follows replies in my inbox. A fact check stops the AI inventing things. 220+ backend tests." font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"><rect x="0.5" y="0.5" width="999" height="205" rx="10" fill="#161b22" stroke="#2f353d"/><rect x="10" y="18" width="6" height="170" rx="3" fill="#93bdf2"/><text x="28" y="40" font-size="23" font-weight="700" fill="#e6e8eb" text-anchor="start" letter-spacing="0">AI Career Tracker</text><text x="28" y="66" font-size="16" font-weight="700" fill="#93bdf2" text-anchor="start" letter-spacing="0">Open-source job-search platform</text><text x="972" y="42" font-size="24" font-weight="400" fill="#93bdf2" text-anchor="end" letter-spacing="0">↗</text><text x="28" y="98" font-size="16" font-weight="400" fill="#a3a9b1" text-anchor="start" letter-spacing="0">I built this for my own job hunt. It collects jobs from career pages, ranks them against my CV, tailors the CV for</text><text x="28" y="123" font-size="16" font-weight="400" fill="#a3a9b1" text-anchor="start" letter-spacing="0">each one and follows replies in my inbox. A fact check stops the AI inventing things. 220+ backend tests.</text><rect x="28" y="140" width="70" height="28" rx="6" fill="#172436"/><text x="62.870000000000005" y="159" font-size="14" font-weight="600" fill="#93bdf2" text-anchor="middle" letter-spacing="0">Python</text><rect x="105.74000000000001" y="140" width="77" height="28" rx="6" fill="#172436"/><text x="144.25" y="159" font-size="14" font-weight="600" fill="#93bdf2" text-anchor="middle" letter-spacing="0">FastAPI</text><rect x="190.76000000000002" y="140" width="105" height="28" rx="6" fill="#172436"/><text x="243.34000000000003" y="159" font-size="14" font-weight="600" fill="#93bdf2" text-anchor="middle" letter-spacing="0">PostgreSQL</text><rect x="303.92" y="140" width="84" height="28" rx="6" fill="#172436"/><text x="345.72" y="159" font-size="14" font-weight="600" fill="#93bdf2" text-anchor="middle" letter-spacing="0">pgvector</text><rect x="395.52000000000004" y="140" width="62" height="28" rx="6" fill="#172436"/><text x="426.54" y="159" font-size="14" font-weight="600" fill="#93bdf2" text-anchor="middle" letter-spacing="0">React</text><rect x="465.56000000000006" y="140" width="99" height="28" rx="6" fill="#172436"/><text x="514.85" y="159" font-size="14" font-weight="600" fill="#93bdf2" text-anchor="middle" letter-spacing="0">TypeScript</text><rect x="572.1400000000001" y="140" width="70" height="28" rx="6" fill="#172436"/><text x="607.0100000000001" y="159" font-size="14" font-weight="600" fill="#93bdf2" text-anchor="middle" letter-spacing="0">Docker</text></svg>
