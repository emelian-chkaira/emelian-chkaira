<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="424" viewBox="0 0 1000 424" role="img" aria-label="Emelian Chkaira, software engineer: mobile, backend and AI, Apeldoorn, Netherlands. 5+ years of production experience." font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"><rect x="0.5" y="0.5" width="999" height="423" rx="12" fill="#ffffff" stroke="#dcdfe3"/><text x="44" y="82" font-size="50" font-weight="800" fill="#1f2328" text-anchor="start" letter-spacing="-1">Emelian Chkaira</text><text x="44" y="122" font-size="23" font-weight="700" fill="#a8461f" text-anchor="start" letter-spacing="0">Software Engineer  |  Mobile, Backend and AI</text><text x="44" y="166" font-size="18" font-weight="400" fill="#59616a" text-anchor="start" letter-spacing="0">I have been building software for more than five years, first mobile apps, then the backends behind</text><text x="44" y="193" font-size="18" font-weight="400" fill="#59616a" text-anchor="start" letter-spacing="0">them, and now AI features too. I like work that real people end up using.</text><rect x="44" y="24" width="26" height="6" rx="3" fill="#a8461f"/><rect x="78" y="24" width="26" height="6" rx="3" fill="#24714a"/><rect x="112" y="24" width="26" height="6" rx="3" fill="#1f5c9e"/><rect x="146" y="24" width="26" height="6" rx="3" fill="#8a5a00"/><rect x="180" y="24" width="26" height="6" rx="3" fill="#843672"/><rect x="214" y="24" width="26" height="6" rx="3" fill="#0d6b63"/><text x="956" y="82" font-size="17" font-weight="400" fill="#59616a" text-anchor="end" letter-spacing="0">Apeldoorn, Netherlands</text><rect x="44.5" y="226.5" width="295" height="163" rx="10" fill="#fbeee6" stroke="#fbeee6"/><text x="64" y="268" font-size="21" font-weight="800" fill="#a8461f" text-anchor="start" letter-spacing="0">Backend</text><text x="64" y="300" font-size="15.5" font-weight="400" fill="#1f2328" text-anchor="start" letter-spacing="0">Where the data lives. I mostly</text><text x="64" y="323" font-size="15.5" font-weight="400" fill="#1f2328" text-anchor="start" letter-spacing="0">write Python and FastAPI on</text><text x="64" y="346" font-size="15.5" font-weight="400" fill="#1f2328" text-anchor="start" letter-spacing="0">PostgreSQL, and Laravel or</text><text x="64" y="369" font-size="15.5" font-weight="400" fill="#1f2328" text-anchor="start" letter-spacing="0">Node.js too.</text><rect x="352.5" y="226.5" width="295" height="163" rx="10" fill="#e8f4ec" stroke="#e8f4ec"/><text x="372" y="268" font-size="21" font-weight="800" fill="#24714a" text-anchor="start" letter-spacing="0">AI</text><text x="372" y="300" font-size="15.5" font-weight="400" fill="#1f2328" text-anchor="start" letter-spacing="0">I connect language models to real</text><text x="372" y="323" font-size="15.5" font-weight="400" fill="#1f2328" text-anchor="start" letter-spacing="0">products: search, scoring and</text><text x="372" y="346" font-size="15.5" font-weight="400" fill="#1f2328" text-anchor="start" letter-spacing="0">writing help, with checks on</text><text x="372" y="369" font-size="15.5" font-weight="400" fill="#1f2328" text-anchor="start" letter-spacing="0">what they say.</text><rect x="660.5" y="226.5" width="295" height="163" rx="10" fill="#e8f0fa" stroke="#e8f0fa"/><text x="680" y="268" font-size="21" font-weight="800" fill="#1f5c9e" text-anchor="start" letter-spacing="0">Mobile</text><text x="680" y="300" font-size="15.5" font-weight="400" fill="#1f2328" text-anchor="start" letter-spacing="0">Where I started. Flutter apps on</text><text x="680" y="323" font-size="15.5" font-weight="400" fill="#1f2328" text-anchor="start" letter-spacing="0">the App Store and Google Play,</text><text x="680" y="346" font-size="15.5" font-weight="400" fill="#1f2328" text-anchor="start" letter-spacing="0">some with more than 10,000</text><text x="680" y="369" font-size="15.5" font-weight="400" fill="#1f2328" text-anchor="start" letter-spacing="0">users.</text></svg>
