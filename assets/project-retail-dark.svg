<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="218" viewBox="0 0 1000 218" role="img" aria-label="Albert Heijn Analytics Study: Real store and product open data with simulated shoppers and sales. Demand forecast error 16.6% against 25.6% for a moving average, 6 shopper segments, a flyer planner and 18 analyses. Only 10.5% of past promos added margin." font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"><rect x="0.5" y="0.5" width="999" height="205" rx="10" fill="#161b22" stroke="#2f353d"/><rect x="10" y="18" width="6" height="170" rx="3" fill="#86d3a2"/><text x="28" y="40" font-size="23" font-weight="700" fill="#e6e8eb" text-anchor="start" letter-spacing="0">Albert Heijn Analytics Study</text><text x="28" y="66" font-size="16" font-weight="700" fill="#86d3a2" text-anchor="start" letter-spacing="0">Unofficial retail analytics study, open source</text><text x="972" y="42" font-size="24" font-weight="400" fill="#86d3a2" text-anchor="end" letter-spacing="0">↗</text><text x="28" y="98" font-size="16" font-weight="400" fill="#a3a9b1" text-anchor="start" letter-spacing="0">Real store and product open data with simulated shoppers and sales. Demand forecast error 16.6% against 25.6%</text><text x="28" y="123" font-size="16" font-weight="400" fill="#a3a9b1" text-anchor="start" letter-spacing="0">for a moving average, 6 shopper segments, a flyer planner and 18 analyses. Only 10.5% of promotions paid off.</text><rect x="28" y="140" width="73" height="28" rx="6" fill="#17281e"/><text x="64.5" y="159" font-size="14" font-weight="600" fill="#86d3a2" text-anchor="middle" letter-spacing="0">Python</text><rect x="109" y="140" width="81" height="28" rx="6" fill="#17281e"/><text x="149.5" y="159" font-size="14" font-weight="600" fill="#86d3a2" text-anchor="middle" letter-spacing="0">FastAPI</text><rect x="198" y="140" width="120" height="28" rx="6" fill="#17281e"/><text x="258.0" y="159" font-size="14" font-weight="600" fill="#86d3a2" text